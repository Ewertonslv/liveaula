  pipeline:
    steps:
      - id: step-01
        agent: gabriela-mendes
        label: Arquitetura técnica e decisões de stack
        execution: inline

      - id: step-02
        agent: thiago-costa
        label: Design system, identidade visual e fluxos UX
        deliverFrom: gabriela-mendes
        execution: inline

      - id: step-03
        agent: isabella-rodrigues
        label: Backend — schema, API REST e contratos
        deliverFrom: thiago-costa
        execution: inline

      - id: step-04
        agent: lucas-ferreira
        label: Frontend Web — Next.js (painel do professor)
        deliverFrom: isabella-rodrigues
        execution: inline

      - id: step-05
        agent: marina-santos
        label: Mobile — React Native iOS + Android (app do pai/mãe)
        deliverFrom: lucas-ferreira
        execution: inline

      - id: step-06
        agent: fernando-alves
        label: Segurança, autenticação e conformidade LGPD
        deliverFrom: marina-santos
        execution: inline

      - id: step-07
        agent: paulo-lima
        label: Infraestrutura, cloud e CI/CD
        deliverFrom: fernando-alves
        execution: inline

      - id: step-08
        agent: carolina-freitas
        label: QA — estratégia de testes e critérios de aceite
        deliverFrom: paulo-lima
        execution: inline

      - id: step-09
        agent: diego-moreira
        label: Advogado do Diabo — revisão crítica de tudo
        deliverFrom: carolina-freitas
        execution: inline
