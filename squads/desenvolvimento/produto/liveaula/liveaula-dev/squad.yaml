      name: Gabriela Mendes
      icon: brain
      avatar: "https://api.dicebear.com/9.x/adventurer/svg?seed=Gabriela"
      prompt: agents/gabriela-mendes.md

    - id: thiago-costa
      name: Thiago Costa
      icon: palette
      avatar: "https://api.dicebear.com/9.x/adventurer/svg?seed=Thiago"
