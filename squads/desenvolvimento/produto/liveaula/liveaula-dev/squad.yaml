squad:
  code: acompanha-dev
  setor: desenvolvimento
  grupo: produto
  sessao: acompanha
  name: liveaula — Squad de Desenvolvimento
  description: Squad completo de desenvolvimento do produto liveaula. A cada execução recebe uma feature ou sprint como input e produz arquitetura, design, código (web + mobile + backend), segurança, infra e QA — finalizado com revisão crítica do advogado do diabo.
  icon: laptop-code
  version: "1.0.0"

  company: "_expxagents/_memory/company.md"
  preferences: "_expxagents/_memory/preferences.md"
  memory: "_memory/memories.md"

  target_audience: Equipe de desenvolvimento do produto liveaula
  platform: web (Next.js) + mobile iOS/Android (React Native) + backend (Node.js)
  format: technical-spec

  schedule:
    enabled: false

  skills: []

  data: []

  agents:
